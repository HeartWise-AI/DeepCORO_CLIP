pipeline_project: DeepCORO_video_linear_probing
base_checkpoint_path: outputs
run_mode: train
epochs: 3
seed: 42

name: autoresearch_deeprv
project: autoresearch_deeprv
entity: mhi_ai
tag: deeprv_autoresearch
use_wandb: false

device: 0
world_size: 1
is_ref_device: true
output_dir: outputs/DeepCORO_video_linear_probing/autoresearch_deeprv

scheduler_name: cosine_with_warmup
num_warmup_percent: 0.1
optimizer: AdamW
use_amp: true
gradient_accumulation_steps: 1
lr_step_period: 4
factor: 0.1
num_hard_restarts_cycles: 3
warm_restart_tmult: 2.0

data_filename: /volume/DeepCORO_CLIP/output_dataset/DeepRV_10pct.csv
num_workers: 4
batch_size: 12
datapoint_loc_label: FileName
target_label:
- Outcome
rand_augment: false
resize: 224
frames: 16
stride: 1

