  prox_rca_stenosis: !!float 0.2
  mid_rca_stenosis: !!float 0.2
  dist_rca_stenosis: !!float 0.2
  pda_stenosis: !!float 0.2
  posterolateral_stenosis: !!float 0.2
  left_main_stenosis: !!float 0.2
  prox_lad_stenosis: !!float 0.2
  mid_lad_stenosis: !!float 0.2
  dist_lad_stenosis: !!float 0.2
  D1_stenosis: !!float 0.2
  D2_stenosis: !!float 0.2
  prox_lcx_stenosis: !!float 0.2
  mid_lcx_stenosis: !!float 0.2
  dist_lcx_stenosis: !!float 0.2
  om1_stenosis: !!float 0.2
  om2_stenosis: !!float 0.2
  bx_stenosis: !!float 0.2
  lvp_stenosis: !!float 0.2
loss_structure:
  prox_rca_stenosis: !!str huber
  mid_rca_stenosis: !!str huber
  dist_rca_stenosis: !!str huber
  pda_stenosis: !!str huber
  posterolateral_stenosis: !!str huber
  left_main_stenosis: !!str huber
  prox_lad_stenosis: !!str huber
  mid_lad_stenosis: !!str huber
  dist_lad_stenosis: !!str huber
  D1_stenosis: !!str huber
  D2_stenosis: !!str huber
  prox_lcx_stenosis: !!str huber
  mid_lcx_stenosis: !!str huber
  dist_lcx_stenosis: !!str huber
  om1_stenosis: !!str huber
  om2_stenosis: !!str huber
  bx_stenosis: !!str huber
  lvp_stenosis: !!str huber
head_lr:
  prox_rca_stenosis: !!float 0.0005
  mid_rca_stenosis: !!float 0.0005
  dist_rca_stenosis: !!float 0.0005
  pda_stenosis: !!float 0.0005
  posterolateral_stenosis: !!float 0.0005
  left_main_stenosis: !!float 0.0005
  prox_lad_stenosis: !!float 0.0005
  mid_lad_stenosis: !!float 0.0005
  dist_lad_stenosis: !!float 0.0005
  D1_stenosis: !!float 0.0005
  D2_stenosis: !!float 0.0005
  prox_lcx_stenosis: !!float 0.0005
