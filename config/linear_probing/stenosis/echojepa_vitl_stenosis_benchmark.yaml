  mid_rca_stenosis: !!int 1
  dist_rca_stenosis: !!int 1
  pda_stenosis: !!int 1
  posterolateral_stenosis: !!int 1
  left_main_stenosis: !!int 1
  prox_lad_stenosis: !!int 1
  mid_lad_stenosis: !!int 1
  dist_lad_stenosis: !!int 1
  D1_stenosis: !!int 1
  D2_stenosis: !!int 1
  prox_lcx_stenosis: !!int 1
  mid_lcx_stenosis: !!int 1
  dist_lcx_stenosis: !!int 1
  om1_stenosis: !!int 1
  om2_stenosis: !!int 1
  bx_stenosis: !!int 1
  lvp_stenosis: !!int 1
