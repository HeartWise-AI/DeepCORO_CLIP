  Outcome: bce_logit
head_weights:
  Outcome: 1.0
head_dropout:
  Outcome: 0.15
head_task:
  Outcome: binary_classification
head_lr:
  Outcome: 0.004
head_weight_decay:
  Outcome: 1.0e-05

labels_map:
  Outcome:
    normal: 0
    abnormal: 1

ci_confidence_level: 0.95
ci_n_bootstrap: 100
