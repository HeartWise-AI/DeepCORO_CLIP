#   (downloaded to weights/deepcoro_clip_mace/ by utils/download_pretrained_weights.py)
# Encoder init: DeepCORO-CLIP single-video encoder (8av1xygm). The full fine-tuned
#   encoder + MIL + heads are restored from inference_model_path; the encoder path is only
#   needed to build the module before the state dict is loaded.
# Normalization: dataset_mean/dataset_std are the TRAINING-set statistics of run 11zt0zl5
#   and must not be recomputed on the external cohort.
# Inputs: 16 frames, stride 1, 224x224, up to num_videos=3 videos per StudyInstanceUID
#   (the same study-level MIL protocol as the stenosis model, but with num_videos=3).
# Outputs: one sigmoid probability per head (see class_mapping.json on the Hub).
# Provenance: see README "MACE transfer-learning model" — this is the fine-tuned MACE
#   checkpoint available for release; the exact checkpoint behind manuscript Table 4
#   (run m3wanj4z) could not be recovered, its config ships alongside on the Hub.
# Usage: bash scripts/runner.sh --base_config config/inference/mace_external_validation_inference.yaml --run_mode inference --use_wandb false --selected_gpus 0
#   data_filename: alpha-separated CSV with FileName (AVI/MP4 path), StudyInstanceUID and Split == 'inference'.
#   Ground-truth columns (target_label) are optional; leave them NaN for pure inference.
