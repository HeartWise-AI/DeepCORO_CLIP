# HEAD WEIGHTS - 3.0x for distal/branch segments (low prevalence)
head_weights:
  # Proximal/main segments (high prevalence ~17.7%) - keep at 2.0
  prox_rca_stenosis: !!float 2.0
  mid_rca_stenosis: !!float 2.0
  left_main_stenosis: !!float 2.0
  prox_lad_stenosis: !!float 2.0
