# =============================================================================
# EchoJEPA ViT-L -> DeepCORO_CLIP: Stage 1 (video/report contrastive) GPU BENCHMARK
#
# Video backbone : EchoJEPA ViT-L/16 coronary encoder (echojepa-vitl-coro-cooldown-ep60),
#                  16 frames @ 224px, RoPE, run under bf16 autocast (SDPA attention).
# Text backbone  : PubMedBERT (DeepCORO_CLIP default).
# Data           : MHI angiography videos + reports (single-video mode, Split column).
#
# BENCHMARK SETTINGS (not a recipe for a converged model; W&B logging ON, entity mhi_ai):
#   epochs 1, no W&B, rand_augment off (keeps the CPU decode path off the critical
#   path so the GPUs are the bottleneck), batch 24 per GPU = the largest batch that
#   fits a 48 GB GPU without activation checkpointing (probe: 36.3 GiB @ 24, OOM @ 32;
#   activation checkpointing fits 80+ but is ~25% slower per clip).
#   4 GPUs -> global batch 96 contrastive pairs.
# =============================================================================
pipeline_project: DeepCORO_clip
base_checkpoint_path: outputs
run_mode: !!str train
epochs: 1
num_workers: 14           # per rank; 4 ranks x 14 = 56 decode workers on 64 cores
persistent_workers: true
prefetch_factor: 4
debug: false
use_amp: true
period: 1
seed: 42

# ---- Data -------------------------------------------------------------------
data_filename: /media/data1/ravram/DeepCORO_CLIP_ENCODER/datasets/reports_with_alpha_separator_with_Calcifc_Stenosis_IFR_20250601_RCA_LCA_merged_with_left_dominance_dependent_vessels.csv
root: "."
target_label: Report
datapoint_loc_label: FileName
frames: 16                # EchoJEPA clip length (tubelet 2 -> 8 temporal tokens)
stride: 2
resize: 224
aggregate_videos_tokens: true
per_video_pool: false
multi_video: false
num_videos: 1
groupby_column: StudyInstanceUID
shuffle_videos: true
batch_size: 24
rand_augment: false
apply_mask: false

# ---- Video encoder: EchoJEPA ------------------------------------------------
model_name: echojepa
pretrained: true
echojepa_repo: /volume/EchoJEPA
echojepa_checkpoint: /media/data1/models/EchoJEPA/encoders/echojepa-vitl-coro-cooldown-ep60/checkpoint.pt
echojepa_checkpoint_key: target_encoder
echojepa_arch: vit_large
echojepa_patch_size: 16
echojepa_tubelet_size: 2
echojepa_use_rope: true
echojepa_uniform_power: true
echojepa_dtype: bfloat16
echojepa_activation_checkpointing: false
video_freeze_ratio: 0.87  # top 87% of backbone params train (as in the MViT recipe)
text_freeze_ratio: 0.92
dropout: 0.15
num_heads: 8
aggregator_depth: 2
video_pooling_mode: mean

# ---- Optimisation -----------------------------------------------------------
optimizer: AdamW
scheduler_name: cosine
lr: 0.00006
lr_step_period: 20
factor: 0.45
loss_name: contrastive
video_weight_decay: 0.0000065
text_weight_decay: 0.0000008
gradient_accumulation_steps: 1
num_warmup_percent: 0.1
num_hard_restarts_cycles: 1.0
warm_restart_tmult: 2
max_grad_norm: 1.0
temperature: 0.06

# ---- Metrics ----------------------------------------------------------------
recall_k: [1, 5, 10, 50]
ndcg_k: [5]

# ---- Checkpointing ----------------------------------------------------------
resume_training: false
checkpoint: ""
output_dir: outputs
save_best: loss

# ---- W&B (off for the benchmark) --------------------------------------------
tag: echojepa_vitl_coro_clip_benchmark
name: echojepa_vitl_clip_benchmark
project: DeepCORO_Clip_EchoJEPA_benchmark
entity: mhi_ai
use_wandb: !!bool true

# ---- Inference (unused in train) --------------------------------------------
topk: 5
text_embeddings_path: /media/data1/datasets/ECG_Tokenizer/utils/inference/reports_embeddings.pt
metadata_path: /media/data1/datasets/ECG_Tokenizer/utils/inference/reports_metadata.parquet
inference_results_path: checkpoints/inference/
