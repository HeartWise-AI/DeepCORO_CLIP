# =============================================================================
# EchoJEPA ViT-L -> DeepCORO_CLIP: Stage 2 (18-target stenosis linear probing) GPU BENCHMARK
# Derived from base_config_multiview_weighted_distal_simple.yaml. The video encoder is
# the EchoJEPA-backbone VideoEncoder trained in Stage 1 (video_encoder_checkpoint_path
# is filled in by scripts/run_echojepa_benchmark.sh); echojepa_checkpoint stays null so
# the 5 GB SSL checkpoint is not loaded only to be overwritten by the CLIP weights.
# Benchmark settings: epochs 1, no W&B, rand_augment off, batch 2 studies x 10 videos
# = 20 ViT-L clips per GPU per step (~31 GiB of 48); 4 GPUs.
# =============================================================================

# Pipeline parameters
pipeline_project: !!str DeepCORO_video_linear_probing
base_checkpoint_path: !!str outputs
run_mode: !!str train
epochs: !!int 1
seed: !!int 42
tag: !!str echojepa_vitl_stenosis_benchmark
# wandb parameters
name: !!str echojepa_vitl_stenosis_benchmark
project: !!str DeepCORO_stenosis_EchoJEPA_benchmark
entity: !!str mhi_ai
use_wandb: !!bool true
# Training parameters
scheduler_name: !!str cosine_with_warmup
num_warmup_percent: !!float 0.06918984863633086
optimizer: !!str AdamW
use_amp: !!bool true
gradient_accumulation_steps: !!int 1
# Scheduler parameters
lr_step_period: !!int 4
factor: !!float 0.16090885523071338
num_hard_restarts_cycles: !!int 3
warm_restart_tmult: !!float 2.0
# Dataset parameters
data_filename: !!str /media/data1/ravram/DeepCORO_CLIP_ENCODER/datasets/reports_with_alpha_separator_with_Calcifc_Stenosis_IFR_20250601_RCA_LCA_merged_with_left_dominance_dependent_vessels.csv
num_workers: !!int 12
batch_size: !!int 2
multi_video: !!bool true
groupby_column: !!str 'StudyInstanceUID'
num_videos: !!int 10
shuffle_videos: !!bool true
datapoint_loc_label: !!str FileName
# Only stenosis columns that exist in the dataset
target_label:
  - prox_rca_stenosis
  - mid_rca_stenosis
  - dist_rca_stenosis
  - pda_stenosis
  - posterolateral_stenosis
  - left_main_stenosis
  - prox_lad_stenosis
  - mid_lad_stenosis
  - dist_lad_stenosis
  - D1_stenosis
  - D2_stenosis
  - prox_lcx_stenosis
  - mid_lcx_stenosis
  - dist_lcx_stenosis
  - om1_stenosis
  - om2_stenosis
  - bx_stenosis
  - lvp_stenosis
rand_augment: !!bool false
resize: !!int 224
frames: !!int 16
stride: !!int 1
# Improved CLS Token Configuration
pooling_mode: !!str attention+cls_token
separate_video_attention: !!bool false
num_attention_heads: !!int 6
normalization_strategy: !!str pre_norm
use_cls_token: !!bool true
attention_hidden: !!int 256
dropout_attention: !!float 0.29909803463691986
# Video Encoder parameters
model_name: !!str echojepa
aggregator_depth: !!int 2   # must match the Stage-1 CLIP config (checkpoint holds aggregator.blocks.*)
num_heads: !!int 8
video_freeze_ratio: !!float 0.7987585697606139
dropout: !!float 0.19626902693861784
pretrained: !!bool true
# Learning rates
video_encoder_lr: !!float 0.00000549653349812252
video_encoder_weight_decay: !!float 0.00000044495284358638
attention_within_lr: !!float 0.004147263799348898
attention_across_lr: !!float 0.002025021570305698
attention_weight_decay: !!float 0.00005
attention_lr: !!float 0.0015
attention_within_weight_decay: !!float 0.00006304012341593597
attention_across_weight_decay: !!float 0.00000681087681405496
head_lr: !!float 3e-4
head_weight_decay: !!float 1e-5
video_encoder_checkpoint_path: !!str outputs/DeepCORO_clip/DeepCORO_Clip_EchoJEPA_benchmark/26x4vqml_20260929-005617/checkpoints/best_model_epoch_0.pt
aggregate_videos_tokens: !!bool false
per_video_pool: !!bool false
output_dir: !!str outputs/
# Linear Probing parameters - only stenosis regression
head_linear_probing:
  prox_rca_stenosis: !!str cls_token_linear_probing_regression
  mid_rca_stenosis: !!str cls_token_linear_probing_regression
  dist_rca_stenosis: !!str cls_token_linear_probing_regression
  pda_stenosis: !!str cls_token_linear_probing_regression
  posterolateral_stenosis: !!str cls_token_linear_probing_regression
  left_main_stenosis: !!str cls_token_linear_probing_regression
  prox_lad_stenosis: !!str cls_token_linear_probing_regression
  mid_lad_stenosis: !!str cls_token_linear_probing_regression
  dist_lad_stenosis: !!str cls_token_linear_probing_regression
  D1_stenosis: !!str cls_token_linear_probing_regression
  D2_stenosis: !!str cls_token_linear_probing_regression
  prox_lcx_stenosis: !!str cls_token_linear_probing_regression
  mid_lcx_stenosis: !!str cls_token_linear_probing_regression
  dist_lcx_stenosis: !!str cls_token_linear_probing_regression
  om1_stenosis: !!str cls_token_linear_probing_regression
  om2_stenosis: !!str cls_token_linear_probing_regression
  bx_stenosis: !!str cls_token_linear_probing_regression
  lvp_stenosis: !!str cls_token_linear_probing_regression
head_structure:
