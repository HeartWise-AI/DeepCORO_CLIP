# DeepCORO-CLIP DeepRV (epoch 4) — Docker external validation
#
# Checkpoint: heartwise/DeepRV_CLIP -> best_model_epoch_4.pt
#   (sha256 9e0c9dc4…; downloaded to weights/DeepRV_CLIP/ by utils/download_pretrained_weights.py --models deeprv)
# Inputs: diagnostic-phase Left + Right Coronary videos, up to 6 per StudyInstanceUID, 16 frames, stride 2, 224x224.
# Output: Outcome_pred = P(abnormal RV systolic function on echo).
# Normalization: dataset_mean/dataset_std are the training-set statistics; do not recompute them.
# The fine-tuned encoder is restored from inference_model_path; video_encoder_checkpoint_path is only read in training.
# Usage: DEEPCORO_BASE_CONFIG=config/linear_probing/DeepRV/docker_base_config_deeprv.yaml python scripts/external_validation.py
pipeline_project: DeepCORO_video_linear_probing
base_checkpoint_path: results/outputs
run_mode: inference
epochs: 5
seed: 42

name: deepcoro_clip_deeprv_external_validation
project: DeepCORO-DeepRV
entity: heartwise
tag: deeprv_ep4_docker
use_wandb: false

device: 0
world_size: 1
is_ref_device: true
output_dir: outputs/

scheduler_name: cosine_with_warmup
num_warmup_percent: 0.1
optimizer: AdamW
use_amp: true
gradient_accumulation_steps: 1
lr_step_period: 4
factor: 0.1
num_hard_restarts_cycles: 3
warm_restart_tmult: 2.0

data_filename: tmp/df_preprocessed_filtered.csv
num_workers: 8
batch_size: 4
datapoint_loc_label: FileName
target_label:
- Outcome
rand_augment: false
resize: 224
frames: 16
stride: 2

model_name: mvit
aggregator_depth: 1
num_heads: 16
video_freeze_ratio: 0.9
dropout: 0.15
pretrained: true
video_encoder_checkpoint_path: pretrained_models/DeepCORO_CLIP_ENCODER/single_video/8av1xygm_20250605-083820_best_single_video/checkpoint.pt
video_encoder_lr: 8.0e-06
video_encoder_weight_decay: 2.0e-06

multi_video: true
groupby_column: StudyInstanceUID
num_videos: 6
shuffle_videos: false

pooling_mode: attention+cls_token
attention_hidden: 128
dropout_attention: 0.2
attention_lr: 0.0001
attention_weight_decay: 5.0e-05
use_cls_token: true
num_attention_heads: 4
separate_video_attention: true
normalization_strategy: pre_norm
attention_within_lr: 0.002
attention_across_lr: 0.0012
attention_within_weight_decay: 5.0e-05
attention_across_weight_decay: 5.0e-05
aggregate_videos_tokens: false
per_video_pool: false
train_pooling_params: true

view_column: null
num_view_classes: 0
view_labels_map: null

head_structure:
  Outcome: 1
loss_structure:
  Outcome: bce_logit
head_weights:
  Outcome: 1.0
head_dropout:
  Outcome: 0.2
head_task:
  Outcome: binary_classification
head_lr:
  Outcome: 0.0005
head_weight_decay:
  Outcome: 1.0e-05

labels_map:
  Outcome:
    normal: 0
    abnormal: 1

inference_model_path: weights/DeepRV_CLIP/best_model_epoch_4.pt

ci_confidence_level: 0.95
ci_n_bootstrap: 500

dataset_mean: [133.98593139648438, 133.98593139648438, 133.98593139648438]
dataset_std: [27.26662254333496, 27.26662254333496, 27.26662254333496]
# Coronary systems fed to the model (scripts/external_validation.py; default Left + Right Coronary)
vasovision_main_structures:
- Left Coronary
- Right Coronary
